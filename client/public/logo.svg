<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="shruti-logo-title">
  <title id="shruti-logo-title">Shruti</title>
  <!--
    The mark is the product's core idea drawn literally: narration as a run of
    bars, a deliberate silence in the middle, and one taller accent bar speaking
    into that silence. Shruti talks in the gaps and nowhere else.

    Kept to six shapes so it survives a 16px favicon.
  -->
  <rect width="64" height="64" rx="15" fill="#7c5cd6"/>

  <!-- narration -->
  <g fill="#ffffff">
    <rect x="6" y="25" width="5" height="14" rx="2.5"/>
    <rect x="13" y="20" width="5" height="24" rx="2.5"/>
    <rect x="20" y="23" width="5" height="18" rx="2.5"/>
  </g>

  <!-- the description, spoken in the pause -->
  <rect x="32" y="15" width="6" height="34" rx="3" fill="#5fd6e2"/>

  <!-- narration resumes -->
  <g fill="#ffffff">
    <rect x="45" y="22" width="5" height="20" rx="2.5"/>
    <rect x="52" y="26" width="5" height="12" rx="2.5"/>
  </g>
</svg>
